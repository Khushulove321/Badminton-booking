<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Badminton Booking</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container auth-container">
        <div class="auth-box">
            <h1>🏸 Create Account</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="password">Special Password</label>
                    <input type="password" id="password" placeholder="Enter special password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p class="auth-link">
                Already have an account? <a href="/login.html">Login here</a>
            </p>
            <a href="/index.html" class="back-link">← Back to Home</a>
        </div>
    </div>
    <script src="/js/supabase-setup.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
